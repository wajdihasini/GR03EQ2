<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Activité 8 - State & Event</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.development.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.development.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        class App extends React.Component { constructor(props) { super(props); this.state = { msg: "Veuillez vous inscrire", ins: "Inscription", cloche: "cloche1.png" }; } styles = { fontWeight: "bold", color: "teal" }; // Style pour redimensionner les cloches
        styleImg = { width: "120px", height: "150px" }; Changement = () => { this.setState({ msg: "Suivez les màj", ins: "Déjà inscrit", cloche: "cloche2.png" }); }; render() { return (
        <div onMouseOver={this.Changement}>
            <h1 style={this.styles}>{this.state.msg}</h1>
            <button>{this.state.ins}</button>
            <br /><br />
            <img src={this.state.cloche} style={this.styleImg} alt="cloche" />
        </div>
        ); } } const root = ReactDOM.createRoot(document.getElementById("root")); root.render(
        <App />);
    </script>
</body>

</html>
