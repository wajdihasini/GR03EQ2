<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8" />
    <title>Activité 3 - Composant</title>
    <script src="https://unpkg.com/react@17/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@17/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const apprenant = { nomApprenant: 'Foulen', prenomApprenant: 'Ben Foulen' }; function AccueilEtudiant(props) { return (
        <strong>
          Bonne découverte de React {props.nomApprenant} {props.prenomApprenant}
        </strong> ); } const elt = (
        <AccueilEtudiant nomApprenant={apprenant.nomApprenant} prenomApprenant={apprenant.prenomApprenant} /> ); ReactDOM.render(elt, document.getElementById('root'));
    </script>
</body>

</html>
